allowed_k: [4, 8, 16, 24, 32, 48, 64]  # real switch port counts; k and any sweep.values for
                                        # topology.k must come from this list
topology:
  k: 8                         # switch port count, must be in allowed_k above
  type: fat-tree                # fat-tree | traditional-tree (conventional oversubscribed tree, for comparison)
failures:
  link_pct: 1                  # % of links that fail; can also be a [min, max] range,
                                # e.g. [0, 20], to pick a random pct each run (seeded)
  switch_pct: 0                # % of switches that fail (node + all its links removed)
                                # also accepts a [min, max] range, same as link_pct
  link_layers: [edge-agg, agg-core]   # host-edge excluded by default
  switch_layers: [core, agg, edge]
  mode: exact                  # exact = round(pct*N) uniform without replacement
                                # bernoulli = each element fails independently with p
traffic:
  pattern: random                # random | stride | staggered | same-pod | all-to-all | incast
                                  # | inter-pod-incoming | same-id-outgoing
  stride: 1                      # used when pattern = stride
  subnet_p: 0.5                  # staggered: P(dst in same edge switch)
  pod_p: 0.3                     # staggered: P(dst in same pod, different edge switch)
  incast_senders: 8              # used when pattern = incast
  load: 1.0                      # each host sends at load * link rate
  size_model: mice-elephants     # fixed | mice-elephants | empirical
  fixed_size_bytes: 1000000      # used when size_model = fixed
  elephant_fraction: 0.1         # used when size_model = mice-elephants
  elephant_size_range: [10000000, 1000000000]
  mouse_size_range: [2000, 100000]
  elephant_threshold_bytes: 10000000  # a flow >= this size is class "elephant"
  empirical_cdf: null            # path to a size_bytes,cdf CSV; used when size_model = empirical
routing: two-level               # single-path | ecmp | two-level | classifier | scheduler
two_level:
  failover: false                # static tables don't reroute on failure unless true (paper Sec. 3.8)
classifier:
  rearrange_interval_s: 1.0       # paper: t = 1s
  max_moves: 3                    # flows moved per rearrangement (Algorithm 3)
  max_rounds: 20                  # stop early once a round moves nothing
simulation:
  level: flow                     # graph | flow | packet (packet only supports k <= max_k below)
packet:
  mtu_bytes: 1500
  ack_bytes: 64
  queue_size_packets: 100
  propagation_delay_ns: 1000
  transport: tcp_lite              # udp (open-loop) | tcp_lite (Reno-like, RFC 6298 RTO)
  init_cwnd: 10
  dupack_threshold: 3              # null disables fast retransmit
  min_rto_ms: 200
  spraying: false
  duration_ms: 100                 # simulated time limit
  max_k: 8
incast:
  receiver: null                   # null -> first host of pod 0
  block_bytes: 65536
  rounds: 20
  sender_placement: other-pods     # other-pods | same-pod | random
link_capacity_gbps: 1
trials: 30
seed: 1
output_dir: results
